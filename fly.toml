app = "pulsecord-your-app-name"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

# A Discord bot is an unserved long-running process; Fly service auto-stop
# settings do not apply when no HTTP/TCP service is defined.
[processes]
  app = "npm start"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  processes = ["app"]
