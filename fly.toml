# PulseCord only opens outbound Discord Gateway connections.
# No inbound HTTP service is needed; Fly must not health-check a web port.
app = "pulsecord"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "npm start"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["app"]

# Keep the app process group at one machine: fly scale count app=1
